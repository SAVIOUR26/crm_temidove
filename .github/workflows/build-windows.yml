name: Build Windows artifact

# Runs on every push to main (so you always have a fresh build to hand
# to the client for testing) and on version tags (which additionally
# publishes a GitHub Release with the zipped exe attached). Can also be
# triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift's table/DAO code (database.g.dart, *_dao.g.dart) is
      # generated, not hand-written — see lib/database/database.dart.
      # This must run before `flutter build` or the build fails on
      # missing part files.
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze
        continue-on-error: true # TODO(claude-code): remove once the codebase is lint-clean; don't let this block early builds.

      - name: Build Windows release
        run: flutter build windows --release

      # Package the raw build output (exe + DLLs + data\ folder — see the
      # screenshot in the project history of what NOT to hand the client)
      # into one TemidoveCRM-Setup.exe via Inno Setup, which ships
      # preinstalled on windows-latest runners. Version comes from
      # pubspec.yaml so the installer and the app never disagree.
      - name: Read app version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $version = ($line.Matches[0].Groups[1].Value.Trim() -split '\+')[0]
          echo "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup 6 ships preinstalled on windows-latest runners; fall
          # back to a Chocolatey install if a future runner image drops it
          # or moves it, rather than the build silently failing.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($found) {
              $iscc = $found
            } else {
              choco install innosetup -y --no-progress
              $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" windows\installer\temidove_crm.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: temidove-crm-windows-installer
          path: installer_output/TemidoveCRM-Setup.exe
          retention-days: 30

      # Only on a version tag push (e.g. `git tag v0.1.0 && git push --tags`)
      # — attaches the same installer to a GitHub Release so it's easy to
      # hand the client a direct download link instead of digging through
      # Actions run artifacts.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/TemidoveCRM-Setup.exe
          generate_release_notes: true
