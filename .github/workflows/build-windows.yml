name: Build Windows artifact

# Runs on every push to main (so you always have a fresh build to hand
# to the client for testing) and on version tags (which additionally
# publishes a GitHub Release with the zipped exe attached). Can also be
# triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift's table/DAO code (database.g.dart, *_dao.g.dart) is
      # generated, not hand-written — see lib/database/database.dart.
      # This must run before `flutter build` or the build fails on
      # missing part files.
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze
        continue-on-error: true # TODO(claude-code): remove once the codebase is lint-clean; don't let this block early builds.

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip the build output
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath temidove-crm-windows.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: temidove-crm-windows
          path: temidove-crm-windows.zip
          retention-days: 30

      # Only on a version tag push (e.g. `git tag v0.1.0 && git push --tags`)
      # — attaches the same zip to a GitHub Release so it's easy to hand
      # the client a direct download link instead of digging through
      # Actions run artifacts.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: temidove-crm-windows.zip
          generate_release_notes: true
